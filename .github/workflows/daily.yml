name: Daily gas prices

on:
  schedule:
    # Every day at 6:00 AM Central (Dallas). GitHub schedules in UTC only, so both UTC
    # times are listed and tracker/schedule.py runs whichever one is 6 AM Central that day.
    - cron: "0 11 * * *"   # 6:00 AM CDT (daylight time)
    - cron: "0 12 * * *"   # 6:00 AM CST (standard time)
    # Afternoon backup: only runs if the morning run saved no data for the day.
    - cron: "47 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-gas-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is it 6 AM in Central time (or a backup/manual run)?
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python -m tracker.schedule

      - name: Fetch, build history, write status, open issue
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m tracker.run

      - name: Commit the data files
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/status.json data/source_log.csv
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily data for $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi
