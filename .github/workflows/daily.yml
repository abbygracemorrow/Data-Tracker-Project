name: Daily gas prices

on:
  schedule:
    # The update is due every day at 6:00 AM Central (Dallas). GitHub's scheduler is best
    # effort (runs can start late or be dropped), so the workflow wakes up often and
    # tracker/schedule.py runs the update at the first wake-up at or after 6:00 AM Central,
    # then skips the rest of the day. UTC hours 11-23 cover 6 AM-6 PM Central in both
    # daylight time (UTC-5) and standard time (UTC-6).
    - cron: "0,10,20,30,40,50 11-14 * * *"   # every 10 minutes for the first hours
    - cron: "5,35 15-23 * * *"               # then every 30 minutes until evening
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-gas-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Is today's 6 AM Central update still due?
        id: gate
        run: python3 -m tracker.schedule

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch, build history, write status, open issue
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m tracker.run

      - name: Commit the data files
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/status.json data/source_log.csv
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily data for $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi
