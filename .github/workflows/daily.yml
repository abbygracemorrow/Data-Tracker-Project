name: Daily gas prices

on:
  schedule:
    # 13:23 UTC (about 8:23 a.m. Eastern), after AAA posts the day's averages.
    - cron: "23 13 * * *"
    # Backup run later the same UTC day, in case the first scheduled run is dropped or fails.
    # A second run on the same day replaces that day's raw files, so the day still counts once.
    - cron: "47 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-gas-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch, build history, write status, open issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m tracker.run

      - name: Commit the data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/status.json data/source_log.csv
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily data for $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi
