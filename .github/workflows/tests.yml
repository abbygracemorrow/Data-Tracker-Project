name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  # The daily data commits are pushed by the workflow's own token, and GitHub does not
  # start other workflows for those pushes. This runs the tests after every daily run too.
  workflow_run:
    workflows: ["Daily gas prices"]
    types: [completed]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
