name: probe-eia
on:
  push:
    branches: [probe-eia]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python probe/probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-out && git commit -m "Probe output" && git push origin HEAD:probe-eia-out --force
